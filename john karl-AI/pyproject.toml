[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "john-karl-ai"
version = "0.1.0"
description = "Provider-neutral FastAPI service for John Karl AI workloads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.120,<0.121",
  "fastapi>=0.141,<0.142",
  "pydantic-settings>=2.14,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.7,<3",
  "mypy>=1.15,<2",
  "pytest>=9.1,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true
